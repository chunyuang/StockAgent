[program:xvnc]
command=/usr/bin/Xvnc :99 -depth 24 -geometry 1920x1080 -rfbport 5900 -localhost -AlwaysShared -SecurityTypes None -AcceptCutText -SendCutText
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/log/browser-vnc/xvnc.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:dbus-session]
command=/opt/browser-vnc/start-dbus.sh
user=root
autostart=true
autorestart=true
priority=150
startsecs=3
stdout_logfile=/var/log/browser-vnc/dbus-session.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:xfce]
command=/opt/browser-vnc/start-xfce.sh
user=root
autostart=true
autorestart=true
priority=200
startsecs=5
stdout_logfile=/var/log/browser-vnc/xfce.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:fcitx5]
command=/opt/browser-vnc/start-fcitx5.sh
user=root
autostart=true
autorestart=true
priority=300
startsecs=15
startretries=3
stdout_logfile=/var/log/browser-vnc/fcitx5.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:websockify]
command=/usr/bin/websockify --auth-plugin=ExpectOrigin --auth-source=https://arkclaw.apigateway 6080 localhost:5900
autostart=true
autorestart=true
priority=350
startsecs=5
stdout_logfile=/var/log/browser-vnc/websockify.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:browser-session]
command=/opt/browser-vnc/start-browser-session.sh
user=browser
autostart=true
autorestart=true
priority=400
startsecs=15
stdout_logfile=/var/log/browser-vnc/browser-session.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

[program:monitor-browser]
command=/opt/browser-vnc/start-monitor-browser.sh
user=browser
autostart=true
autorestart=true
priority=500
startsecs=10
startretries=5
stdout_logfile=/var/log/browser-vnc/monitor-browser.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true
stopwaitsecs=10
stopsignal=TERM

[group:cua-vnc]
programs=xvnc,dbus-session,websockify,xfce,fcitx5,browser-session,monitor-browser
