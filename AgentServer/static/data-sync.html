<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据同步</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #303133; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
h1 { font-size: 22px; margin-bottom: 20px; color: #409eff; }
.card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.card h2 { font-size: 16px; margin-bottom: 12px; color: #606266; }
.row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.btn { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all .2s; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: #409eff; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #66b1ff; }
.btn-success { background: #67c23a; color: #fff; }
.btn-success:hover:not(:disabled) { background: #85ce61; }
.btn-warning { background: #e6a23c; color: #fff; }
.btn-warning:hover:not(:disabled) { background: #ebb563; }
.status { margin-top: 8px; font-size: 13px; color: #909399; }
.status.success { color: #67c23a; }
.status.error { color: #f56c6c; }
.status.running { color: #e6a23c; }
.log { background: #fafafa; border: 1px solid #ebeef5; border-radius: 4px; padding: 10px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; margin-top: 8px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 6px; }
.badge-done { background: #f0f9eb; color: #67c23a; }
.badge-high { background: #fef0f0; color: #f56c6c; }
.badge-info { background: #f4f4f5; color: #909399; }
.badge-running { background: #fdf6ec; color: #e6a23c; }
table { width: 100%; border-collapse: collapse; margin-top: 12px; }
th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #ebeef5; font-size: 13px; }
th { background: #fafafa; color: #909399; font-weight: 600; }
.action-btn { padding: 4px 12px; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <h1>📊 数据同步管理</h1>
  
  <div class="card">
    <h2>⚡ 一键操作</h2>
    <div class="row">
      <button class="btn btn-success" id="btnSyncAll" onclick="syncAll()">🔄 一键补全（日线+PE/PB+因子）</button>
      <button class="btn btn-primary" id="btnBar" onclick="syncOne('daily-bar')">📈 补今日日线</button>
      <button class="btn btn-primary" id="btnBasic" onclick="syncOne('daily-basic')">💰 补今日PE/PB</button>
      <button class="btn btn-warning" id="btnFactor" onclick="syncOne('factors')">🔢 补算因子</button>
    </div>
    <div class="status" id="syncStatus"></div>
  </div>

  <div class="card">
    <h2>📋 数据状态</h2>
    <div id="dataStatus"><span style="color:#909399">加载中...</span></div>
  </div>

  <div class="card">
    <h2>📜 同步任务记录</h2>
    <table>
      <thead><tr><th>任务ID</th><th>类型</th><th>状态</th><th>开始</th><th>完成</th><th>操作</th></tr></thead>
      <tbody id="taskList"><tr><td colspan="6" style="color:#909399">暂无记录</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const API = '/api/v1/system';
let pollingId = null;

async function api(path, method='GET') {
  try {
    const r = await fetch(API + path, { method });
    return await r.json();
  } catch(e) {
    return { success: false, message: e.message };
  }
}

function setStatus(msg, cls='') {
  const el = document.getElementById('syncStatus');
  el.textContent = msg;
  el.className = 'status ' + cls;
}

function disableBtns(disabled) {
  document.querySelectorAll('.btn').forEach(b => b.disabled = disabled);
}

async function syncAll() {
  disableBtns(true);
  setStatus('⏳ 一键补全启动中...', 'running');
  const r = await api('/sync-all', 'POST');
  if (r.success) {
    setStatus('⏳ 一键补全运行中...', 'running');
    pollStatus(r.task_id);
  } else {
    setStatus('❌ ' + r.message, 'error');
    disableBtns(false);
  }
}

async function syncOne(type) {
  disableBtns(true);
  setStatus(`⏳ 补全 ${type} 启动中...`, 'running');
  const r = await api(`/sync-${type}`, 'POST');
  if (r.success) {
    setStatus(`⏳ 补全 ${type} 运行中...`, 'running');
    pollStatus(r.task_id);
  } else {
    setStatus('❌ ' + r.message, 'error');
    disableBtns(false);
  }
}

async function pollStatus(taskId) {
  if (pollingId) clearInterval(pollingId);
  pollingId = setInterval(async () => {
    const r = await api(`/sync-status/${taskId}`);
    if (!r.success) return;
    const t = r.data;
    if (t.status === 'running' || t.status === 'pending') {
      const step = t.current_step ? ` (当前: ${t.current_step})` : '';
      setStatus(`⏳ 运行中${step}...`, 'running');
    } else if (t.status === 'success') {
      setStatus('✅ 补全完成！', 'success');
      clearInterval(pollingId); pollingId = null;
      disableBtns(false);
      loadDataStatus(); loadTasks();
    } else {
      const err = t.stderr || t.message || '未知错误';
      setStatus(`❌ 补全失败: ${err.substring(0,100)}`, 'error');
      clearInterval(pollingId); pollingId = null;
      disableBtns(false);
      loadTasks();
    }
  }, 2000);
}

async function loadDataStatus() {
  const r = await api('/data-status');
  if (!r.success) return;
  const d = r.data;
  const items = d.action_items || [];
  const diags = d.diagnostics || [];
  let html = '';
  
  if (items.length) {
    html += '<div style="margin-bottom:12px"><strong>待办事项：</strong></div>';
    items.forEach(i => {
      const cls = i.priority === 'done' ? 'badge-done' : i.priority === 'high' ? 'badge-high' : i.priority === 'info' ? 'badge-info' : 'badge-running';
      const apiBtn = i.api ? ` <button class="btn btn-primary action-btn" onclick="syncFromAction('${i.api}')">执行</button>` : '';
      html += `<div style="margin:4px 0"><span class="badge ${cls}">${i.action}</span> ${i.desc}${apiBtn}</div>`;
    });
  }
  
  if (diags.length) {
    html += '<div style="margin-top:12px"><strong>诊断：</strong></div>';
    diags.forEach(d => {
      const color = d.level === 'green' ? '#67c23a' : d.level === 'yellow' ? '#e6a23c' : '#f56c6c';
      html += `<div style="color:${color};font-size:13px;margin:2px 0">${d.message}</div>`;
    });
  }
  
  if (d.data_alignment) {
    const a = d.data_alignment;
    html += `<div style="margin-top:12px;font-size:13px;color:#606266">最新日(${a.date}): 日线${a.stock_daily_count}只 | daily_basic ${a.daily_basic_count}只 | 共有${a.common}只</div>`;
  }
  
  document.getElementById('dataStatus').innerHTML = html || '<span style="color:#67c23a">✅ 数据状态正常</span>';
}

function syncFromAction(apiStr) {
  // apiStr like "POST /api/v1/system/sync-daily-bar"
  const [method, path] = apiStr.split(' ');
  const type = path.split('/sync-')[1];
  if (type === 'all') syncAll();
  else syncOne(type);
}

async function loadTasks() {
  const r = await api('/sync-tasks');
  if (!r.success || !r.data || Object.keys(r.data).length === 0) {
    document.getElementById('taskList').innerHTML = '<tr><td colspan="6" style="color:#909399">暂无记录</td></tr>';
    return;
  }
  const tasks = Object.entries(r.data).sort((a,b) => b[0].localeCompare(a[0]));
  let html = '';
  for (const [id, t] of tasks) {
    const statusCls = t.status === 'success' ? 'color:#67c23a' : t.status === 'failed' || t.status === 'error' ? 'color:#f56c6c' : 'color:#e6a23c';
    html += `<tr>
      <td>${id.substring(0,20)}...</td>
      <td>${t.type}</td>
      <td style="${statusCls}">${t.status}</td>
      <td>${t.started_at ? new Date(t.started_at).toLocaleTimeString() : '-'}</td>
      <td>${t.finished_at ? new Date(t.finished_at).toLocaleTimeString() : '-'}</td>
      <td><button class="btn btn-primary action-btn" onclick="checkTask('${id}')">详情</button></td>
    </tr>`;
  }
  document.getElementById('taskList').innerHTML = html;
}

async function checkTask(taskId) {
  const r = await api(`/sync-status/${taskId}`);
  if (r.success) {
    const t = r.data;
    let info = `任务: ${taskId}\n类型: ${t.type}\n状态: ${t.status}`;
    if (t.started_at) info += `\n开始: ${t.started_at}`;
    if (t.finished_at) info += `\n完成: ${t.finished_at}`;
    if (t.results) {
      t.results.forEach(r => {
        info += `\n\n--- ${r.step} ---`;
        info += r.success ? '\n✅ 成功' : '\n❌ 失败';
        if (r.stderr) info += '\n' + r.stderr.substring(0, 500);
        if (r.stdout) info += '\n' + r.stdout.substring(0, 500);
      });
    }
    if (t.stderr) info += '\n\n错误: ' + t.stderr.substring(0, 500);
    alert(info);
  }
}

// 初始化
loadDataStatus();
loadTasks();
</script>
</body>
</html>
